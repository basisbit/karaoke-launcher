      - -DBUILD_opencv_apps=OFF
      - -DBUILD_opencv_calib3d=OFF
      - -DBUILD_opencv_dnn=OFF
      - -DBUILD_opencv_features2d=OFF
      - -DBUILD_opencv_flann=OFF
      - -DBUILD_opencv_gapi=OFF
      - -DBUILD_opencv_highgui=OFF
      - -DBUILD_opencv_java_bindings_generator=OFF
      - -DBUILD_opencv_ml=OFF
      - -DBUILD_opencv_objdetect=OFF
      - -DBUILD_opencv_photo=OFF
      - -DBUILD_opencv_python2=OFF
      - -DBUILD_opencv_python_bindings_generator=OFF
      - -DBUILD_opencv_python_tests=OFF
      - -DBUILD_opencv_stitching=OFF
      - -DBUILD_opencv_ts=OFF
      - -DBUILD_opencv_video=OFF
      - -DCV_TRACE=OFF
      - -DWITH_PROTOBUF=OFF
      - -DWITH_FFMPEG=OFF
      - -DWITH_ADE=OFF
      - -DWITH_QUIRC=OFF
      - -DWITH_GTK=OFF
      - -DWITH_TIFF=OFF
      - -DWITH_WEBP=OFF
      - -DWITH_JASPER=OFF
      - -DWITH_OPENJPEG=OFF
      - -DWITH_PNG=OFF
      - -DWITH_OPENEXR=OFF
      - -DWITH_GDAL=OFF
      - -DWITH_GDCM=OFF
      - -DWITH_IMGCODEC_HDR=OFF
      - -DWITH_IMGCODEC_SUNRASTER=OFF
      - -DWITH_IMGCODEC_PXM=OFF
      - -DWITH_IMGCODEC_PFM=OFF
    cleanup:
      - /share/opencv4/*cascades
      - /share/opencv4/valgrind*.supp
    sources:
      - type: archive
        url: https://github.com/opencv/opencv/archive/refs/tags/4.12.0.tar.gz
        sha256: 44c106d5bb47efec04e531fd93008b3fcd1d27138985c5baf4eafac0e1ec9e9d

  - name: projectm
    buildsystem: cmake-ninja
    build-options:
      arch:
        x86_64:
          config-opts:
            - -DCMAKE_BUILD_TYPE=Release
            - -DENABLE_PLAYLIST=OFF
            - -DENABLE_GLES=OFF
        aarch64:
          config-opts:
            - -DCMAKE_BUILD_TYPE=Release
            - -DENABLE_PLAYLIST=OFF
            - -DENABLE_GLES=ON
    cleanup:
      - /include/projectM-4
      - /lib/cmake/projectM4
    sources:
      - type: archive
        url: https://github.com/projectM-visualizer/projectm/releases/download/v4.1.6/libprojectM-4.1.6.tar.gz
        sha256: 1b9e6d56c59fe24e5416da4d42e941a34c982811003e43ac88b5aca8afa52c87

  # Flathub's shared module lua5.4/lua-5.4.json, written here with its files downloaded
  - name: lua-5.4
    buildsystem: simple
    build-commands:
      - make -j $FLATPAK_BUILDER_N_JOBS CFLAGS="$CFLAGS -fPIC -DLUA_USE_LINUX" linux
      - make TO_LIB=liblua.so.5.4.6 INSTALL_TOP=$FLATPAK_DEST install
      - ln -sf liblua.so.5.4.6 $FLATPAK_DEST/lib/liblua.so
      - ln -sf liblua.so.5.4.6 $FLATPAK_DEST/lib/liblua.so.5.4
      - make INSTALL_TOP=${FLATPAK_DEST} pc > lua.pc
      - cat lua.pc.in >> lua.pc
      - install -Dm644 lua.pc $FLATPAK_DEST/lib/pkgconfig/lua.pc
      - ln -sf lua.pc $FLATPAK_DEST/lib/pkgconfig/lua54.pc
      - ln -sf lua.pc $FLATPAK_DEST/lib/pkgconfig/lua5.4.pc
      - ln -sf lua.pc $FLATPAK_DEST/lib/pkgconfig/lua-5.4.pc
    sources:
      - type: archive
        url: https://www.lua.org/ftp/lua-5.4.6.tar.gz
        sha256: 7d5ea1b9cb6aa0b59ca3dde1c6adcb57ef83a1ba8e5432c0ecd06bf439b3ad88
      - type: file
        url: https://raw.githubusercontent.com/flathub/shared-modules/b0e640fd5065b15ccb66e1db00c7cc531004ae4c/lua5.4/makefile-add-liblua.so-rule.patch
        sha256: 4b773a37f35dbd87a1d8146ef198a81f81a146625a72c2d05953afb38760701a
        dest: flathub-patches
      - type: file
        url: https://raw.githubusercontent.com/flathub/shared-modules/b0e640fd5065b15ccb66e1db00c7cc531004ae4c/lua5.4/lua.pc.in
        sha256: 6a16a4edf394defb889f19d876d4b1b72a9755268ab3d1ff66db2b44295d0297
      - type: file
        url: https://raw.githubusercontent.com/flathub/shared-modules/b0e640fd5065b15ccb66e1db00c7cc531004ae4c/lua5.4/luaconf.patch
        sha256: a4f021db8dbbb6a8701e8b116ac04db8a44c7d80504ca219d35f31061be348e2
        dest: flathub-patches
      - type: shell
        commands:
          - patch -p1 < flathub-patches/makefile-add-liblua.so-rule.patch
          - patch -p1 < flathub-patches/luaconf.patch
    cleanup:
      - /bin
      - /include
      - /lib/pkgconfig
      - /man

