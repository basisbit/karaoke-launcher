# UltraStar Deluxe 2026.11.0 with the libraries it needs, for the Flatpak of a bundle (karaoke-bundle flatpak).
# The modules come from Flathub's manifest of UltraStar Deluxe (github.com/flathub/eu.usdx.UltraStarDeluxe, file
# eu.usdx.UltraStarDeluxe.yaml at commit 91f2dc34493ba3506ebe3d9611a7ea6c7b6a4591, 2026-11-07) and Flathub's
# shared module lua5.4 (github.com/flathub/shared-modules, commit b0e640fd5065b15ccb66e1db00c7cc531004ae4c).
# Differences:
#   - the libraries are nested modules of ultrastardx (flatpak-builder builds nested modules first);
#   - the patches are downloaded from those commits (url + sha256) and applied with "patch -p1" (what a "patch"
#     source does), instead of being copied into this repository;
#   - left out: install-data.patch and instructions.patch (they install UltraStar Deluxe's own desktop file, icons
#     and metainfo; the bundle has its own), the debug-info patches, the module link-debug-data and the -gdwarf-3
#     flags (for Flathub's debug extension), and x-checker-data (Flathub's update checker).
# The top-level parts of that manifest (sdk-extensions, build-options, cleanup, finish-args) are in ../game.json.
name: ultrastardx
buildsystem: autotools
config-opts:
  - --with-libprojectM
  - --with-opencv-cxx-api
post-install:
  # A font the runtime has too is removed, and fonts.ini points to the runtime's copy (from Flathub's manifest).
  # Changed: fc-scan of the 26.08 SDK prints absolute paths (Flathub's 25.08 printed "./…"), so "$PWD/" is cut off
  # as well; without that, fonts.ini kept the old names of removed fonts and the game stopped at its start
  # ("Could not load font 'FreeSans/FreeSans.ttf'"). The last command fails the build if that happens again.
  - |
    cd ${FLATPAK_DEST}/share/ultrastardx/fonts
    fc-scan -f '%{file} :fullname=%{fullname}\n' . | while read a b ; do
      a=${a#"$PWD"/} ; a=${a#./}
      c=$(fc-list -f '%{file}\n' "$b" | head -n 1)
      if [ -n "$c" ] ; then sed -i "s:=$a:=$c:" fonts.ini ; rm "$a" ; fi
    done
  - for i in ${FLATPAK_DEST}/share/ultrastardx/fonts/*/ ; do [ -n "$(fc-scan -f
    '%{file}' "$i" | head -n 1)" ] || rm -Rf "$i" ; done
  - |
    cd ${FLATPAK_DEST}/share/ultrastardx/fonts
    sed -n 's/^[A-Za-z0-9]*File[0-9]*=//p' fonts.ini | sort -u | while read f ; do
      [ -e "$f" ] || { echo "fonts.ini names $f, which is missing" ; exit 1 ; }
    done
  - mkdir ${FLATPAK_DEST}/lib/ffmpeg
sources:
  - type: git
    url: https://github.com/UltraStar-Deluxe/USDX.git
    tag: v2026.11.0
    commit: 6e15a472d2a6b1192044b9757d11b6d3933deb6e
    disable-submodules: true
  - type: file
    url: https://raw.githubusercontent.com/flathub/eu.usdx.UltraStarDeluxe/91f2dc34493ba3506ebe3d9611a7ea6c7b6a4591/patches/ldflags.patch
    sha256: 7a3e493b1088fe17d8f30f479c6a8caefcf22157e6e98032f262ee3ec57a7331
    dest: flathub-patches
  - type: shell
    commands:
      - patch -p1 < flathub-patches/ldflags.patch
      # Workaround for flathub/org.freedesktop.Sdk.Extension.freepascal#10
      - cp /usr/lib/sdk/freepascal/etc/fpc.cfg fpc.cfg
      - ln -s ../fpc.cfg src/
      - set -- `gcc -print-file-name=crtbegin.o` ; echo -Fl${1%/*} >> fpc.cfg

